# Pipeline configuration. Snapshotted into runs/<project_id>/config.yaml at creation.

# prototype: fixture LLM + research, local media tools, $0 API cost (D-19).
# production: real LLM + research agent on free tiers (evaluation phase, D-27), still $0.
mode: prototype

# Production LLM (D-27, D-28, D-42): keys from env. Per stage, the first provider in its order
# that has a key is primary, the rest are fallbacks. Claude writes; Gemini/Groq only stand in.
llm:
  claude_model: claude-opus-5-5           # content agent (scripting), D-42
  support_model: claude-haiku-5-5         # support check, flags only (D-44)
  planner_model: claude-sonnet-5-5        # shot planner: echo phrases + text pops (D-49)
  claude_effort: high
  claude_max_tokens: 16000
  gemini_model: gemini-flash-lite-latest  # Flash took ~140 s per call on this free tier (D-27)
  groq_model: openai/gpt-oss-120b         # Llama 3.3 70B is no longer offered on Groq (D-28)
  order:
    default: [claude, gemini, groq]       # draft, research agent, photo search (D-51)
    scripting: [claude, groq, gemini]     # Flash-Lite could not pass the script checks (D-28)
  rate_limit_wait_max_seconds: 60   # per-minute 429s waited out in place up to this long

# Production research agent (D-03, D-27): search -> fetch -> verify quote, at most max_turns.
research:
  max_turns: 8
  target_claims: 5

# Attempts per stage (brief §08 / ARCHITECTURE §4). Only RetryableError is retried.
retries:
  researching: 3
  scripting: 3
  rendering: 2       # render 2 (TTS gets 4 inside the node in Phase 4)
  mock_published: 5
backoff:
  initial_seconds: 1.0
  factor: 2.0
  max_seconds: 30.0

# Reaper: a run with no progress past its stage deadline is re-enqueued.
reaper_interval_seconds: 60
stage_deadline_seconds:
  default: 300
  researching: 900
  rendering: 1800

# Stock photos, one per scene (D-33, D-34): first provider with a key is primary; none = solid.
stock:
  providers: [pixabay, pexels]

# Narration (D-23, Dolender's pick by ear). Rendering re-synthesises from scratch on change.
# Production mode with SARVAM_API_KEY: Sarvam; otherwise Kokoro, local and free (D-46).
tts:
  voice: af_heart         # Kokoro
  phonemes: en-us
  speed: 0.95
  # Speaking rate each voice really has (measured on cached runs, D-62); a Short's length is
  # budgeted at its voice's rate. Sarvam ishita_en_stories: 132-141 wpm; Kokoro af_heart: ~166.
  words_per_minute:
    kokoro: 160
    sarvam: 130
  sarvam:
    model: bulbul:v4-flash
    speaker: ishita_en_stories   # stock Ishita voice (D-52); sir's cloned voice ID goes here when ready
    language_code: en-IN
    # Voice controls (D-54), Sarvam's own parameters. Each is sent only to the models that take
    # it; changing one re-synthesises (and re-bills) only beats not yet made with that value.
    pace: 1.0                 # speed; all models (0.5-2.0 on v3/v4-flash, 0.3-3.0 on v2)
    temperature: 0.6          # expressiveness; v3 and v4-flash only (0.01-1.0)
    pitch: 0.0                # bulbul:v2 only (-0.75 to 0.75); not sent to v3/v4-flash
    loudness: 1.0             # bulbul:v2 only (0.3-3.0); every beat is set to -14 LUFS anyway
    attempts: 4               # per sentence, on 429 / 5xx / timeout (CLAUDE.md: TTS 4)
    # Sarvam reads text, not phonemes: spell brand words the way they are said. Captions and
    # the screen keep the written form ("Ziro"). Drop the entry if the listen test says so.
    spelling:
      Ziro: Zyro

# Written form -> how the narrator says it (brief §07: written "Ziro", spoken "ZAIRO").
pronunciation:
  replace:
    ziro.digital: Ziro dot digital
  phonemes:
    Ziro: zˈaɪɹoʊ

# Unit prices (USD) per provider unit; filled per phase from the provider's price page.
prices:
  kokoro-local: 0.0       # characters synthesised on our own CPU
  gemini-input: 0.0       # tokens; free tier (D-27). Rows keep the counts for a paid estimate.
  gemini-output: 0.0
  groq-input: 0.0
  groq-output: 0.0
  tavily-search: 0.0      # searches; free plan credits
  pixabay-search: 0.0     # stock photo searches (D-33, D-34), free API
  pexels-search: 0.0
  # Claude, USD per token (claude-api price table, 2026-10-06); cache writes at 1.25x input.
  claude-opus-5-5-input: 4.0e-6
  claude-opus-5-5-output: 20.0e-6
  claude-opus-5-5-cache-write: 5.0e-6
  claude-opus-5-5-cache-read: 0.2e-6
  claude-haiku-5-5-input: 0.1e-6
  claude-haiku-5-5-output: 0.5e-6
  claude-haiku-5-5-cache-write: 0.125e-6
  claude-haiku-5-5-cache-read: 0.01e-6
  claude-sonnet-5-5-input: 2.0e-6
  claude-sonnet-5-5-output: 10.0e-6
  claude-sonnet-5-5-cache-write: 2.5e-6
  claude-sonnet-5-5-cache-read: 0.2e-6
  # Sarvam TTS, USD per character. ESTIMATE (v2 doc §13: ~₹3 per 60 s Short of ~900
  # characters); replace with the price on sarvam.ai/pricing before relying on it.
  sarvam-tts-characters: 0.00004

# Hard cap on recorded spend per video (USD).
spend_cap_usd: 5.0

# Costs are shown in rupees on the run page (D-63). Approximate rate; update when it moves.
inr_per_usd: 88.0

# Paid-API budget (D-45): a call that would pass either cap is refused and the run fails cleanly.
budget:
  max_tokens_per_run: 200000   # Claude tokens (input + output + cache) across one run
  max_usd_per_day: 15.0        # all recorded spend, all runs, per UTC day

# Topic planner + scheduler (D-47): a planned run starts this long before its publish time, so
# both reviews fit; publish times are entered and shown in this offset (IST).
planner:
  start_hours_before: 3
  utc_offset: "+05:30"
  check_seconds: 60

# Where a published video goes (D-69): mock records a private fake upload; youtube uploads to the
# pinned channel below with the OAuth refresh token from .env. Dolender flips it; mock is default.
publish:
  mode: mock

# Real YouTube target (D-67): the ONLY channel uploads may go to, pinned by ID once sir's consent
# login (`make youtube-auth`) proves the account owns it; checked again before every publish.
# Uploads are private only. Publishing stays mock until Dolender switches it.
youtube:
  channel_handle: "@Ziro.Digital"
  channel_id: ""
