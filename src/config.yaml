# Pipeline configuration. Snapshotted into runs/<project_id>/config.yaml at creation.

# prototype: fixture LLM + research, local media tools, $0 API cost (D-19).
# production: real LLM + research agent on free tiers (evaluation phase, D-27), still $0.
mode: prototype

# Production LLM (D-27): Gemini free tier first, Groq free tier as fallback; keys from env.
llm:
  gemini_model: gemini-flash-latest
  groq_model: llama-3.3-70b-versatile
  rate_limit_wait_max_seconds: 60   # per-minute 429s waited out in place up to this long

# Production research agent (D-03, D-27): search -> fetch -> verify quote, at most max_turns.
research:
  max_turns: 8
  target_claims: 5

# Attempts per stage (brief §08 / ARCHITECTURE §4). Only RetryableError is retried.
retries:
  researching: 3
  scripting: 3
  rendering: 2       # render 2 (TTS gets 4 inside the node in Phase 4)
  mock_published: 5
backoff:
  initial_seconds: 1.0
  factor: 2.0
  max_seconds: 30.0

# Reaper: a run with no progress past its stage deadline is re-enqueued.
reaper_interval_seconds: 60
stage_deadline_seconds:
  default: 300
  researching: 900
  rendering: 1800

# Narration (D-23, Dolender's pick by ear). Rendering re-synthesises from scratch on change.
tts:
  engine: kokoro          # local + free in both modes for now (D-27); sarvam not built (D-19)
  voice: af_heart
  phonemes: en-us
  speed: 0.95

# Written form -> how the narrator says it (brief §07: written "Ziro", spoken "ZAIRO").
pronunciation:
  replace:
    ziro.digital: Ziro dot digital
  phonemes:
    Ziro: zˈaɪɹoʊ

# Unit prices (USD) per provider unit; filled per phase from the provider's price page.
prices:
  kokoro-local: 0.0       # characters synthesised on our own CPU
  gemini-input: 0.0       # tokens; free tier (D-27). Rows keep the counts for a paid estimate.
  gemini-output: 0.0
  groq-input: 0.0
  groq-output: 0.0
  tavily-search: 0.0      # searches; free plan credits

# Hard cap on recorded spend per video (USD).
spend_cap_usd: 5.0
