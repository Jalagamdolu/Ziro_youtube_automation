{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section style="max-width:420px">
  <h1>Log in</h1>
  {% if not configured %}
  <p class="small error">No users are set up. Add ZIRO_ADMIN_USER / ZIRO_ADMIN_PASSWORD and ZIRO_REVIEWER_USER / ZIRO_REVIEWER_PASSWORD to .env and restart.</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Name</label><input type="text" id="username" name="username" required autofocus>
    <label for="password">Password</label><input type="password" id="password" name="password" required
      style="width:100%;padding:6px 8px;font:inherit;border:1px solid var(--line);border-radius:6px">
    <p><button class="primary" type="submit">Log in</button></p>
  </form>
</section>
{% endblock %}
