<details class="panel" id="reject">
  <summary>Reject — send it back</summary>
  <form method="post" action="/ui/projects/{{ run.id }}/decide">
    <input type="hidden" name="decision" value="reject">
    <label for="rj-target">Send back to</label>
    <select id="rj-target" name="target" required>
      {% for t in reject_targets %}<option value="{{ t }}">{{ plain.TARGETS.get(t, t) }}</option>{% endfor %}
    </select>
    <label for="rj-notes">What must change (required; the next step reads it)</label>
    <textarea id="rj-notes" name="notes" required></textarea>
    <p><button class="danger big" type="submit">Reject and send back</button></p>
  </form>
</details>
