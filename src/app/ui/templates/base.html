<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ziro review{% endblock %} · Ziro AI Content Studio</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/htmx.min.js"></script>
  <script>
    // Approve / Edit / Send back (D-63): Edit and Send back open their panel and scroll to it.
    function openPanel(id) { const d = document.getElementById(id); if (d) { d.open = true; d.scrollIntoView({behavior: "smooth"}); } }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/"><img src="/static/brand/ziro-digital-logo-transparent.png" alt="Ziro"></a>
    <span class="mode" title="sandbox · publishing is mocked">{{ mode() }} · sandbox</span>
    <nav>
      <a href="/">Planner</a>
      <a href="/new">New video</a>
      <span class="who">{{ request.state.user.name }}</span>
    </nav>
  </header>
  {% if banners() %}<div class="banners">{% for line in banners() %}<div class="banner">{{ line }}</div>{% endfor %}</div>{% endif %}
  <main>
    {% if error %}<section class="error"><strong>Not done:</strong> {{ error }}</section>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
