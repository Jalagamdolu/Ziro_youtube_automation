<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ziro review{% endblock %} · sandbox</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --ink: #1d2433; --muted: #5b6475; --line: #dde2ea; --bg: #f6f7f9; --card: #fff;
            --ok: #1f7a4d; --warn: #9a5b00; --bad: #b42318; --accent: #2b59c3; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--bg); }
    header { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 24px;
             display: flex; gap: 16px; align-items: baseline; }
    header a { color: var(--ink); text-decoration: none; font-weight: 600; }
    header .tag { color: var(--muted); font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
              padding: 16px 20px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 12px; }
    h3 { font-size: 15px; margin: 16px 0 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    pre { white-space: pre-wrap; background: var(--bg); padding: 12px; border-radius: 6px;
          font-size: 13px; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    input[type=text], textarea, select { width: 100%; padding: 6px 8px; font: inherit;
          border: 1px solid var(--line); border-radius: 6px; }
    textarea { min-height: 60px; }
    button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line);
             background: var(--card); cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--bad); border-color: var(--bad); }
    .row { display: flex; gap: 16px; flex-wrap: wrap; } .row > * { flex: 1; min-width: 260px; }
    .muted { color: var(--muted); } .small { font-size: 13px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px;
            background: var(--bg); border: 1px solid var(--line); }
    .pill.ok { color: var(--ok); border-color: var(--ok); }
    .pill.bad { color: var(--bad); border-color: var(--bad); }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
    .error { border-color: var(--bad); color: var(--bad); }
    .top { font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <a href="/">Ziro YouTube automation</a>
    <span class="tag">sandbox · prototype mode · publishing is mocked</span>
  </header>
  <main>
    {% if error %}<section class="error"><strong>Not done:</strong> {{ error }}</section>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
