[project]
name = "ziro-youtube-automation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "langgraph==1.2.18",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "rq==3.0.0",
  "sqlalchemy==2.1.6",
  "structlog==26.1.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
strict = true
exclude = ["src/vendor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.alembic]
script_location = "src/app/core/migrations"
