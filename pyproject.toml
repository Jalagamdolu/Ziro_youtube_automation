[project]
name = "ziro-youtube-automation"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.20.1",
  "anthropic==1.17.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "langgraph==1.2.18",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "redis==8.1.0",
  "rq==3.0.0",
  "sqlalchemy==2.1.6",
  "structlog==26.1.0",
  "trafilatura==2.3.1",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "respx==0.23.1",
  "ruff==0.17.3",
  "types-pyyaml==6.0.12.20260906",
]

# Worker image only (D-24): local TTS and word alignment.
media = [
  "kokoro-onnx==0.6.1",
  "soundfile==0.14.0",
  "whisperx==3.8.6",
  # Listed directly so [tool.uv.sources] can point them at the CPU-only index (= whisperx's pins).
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
]

[tool.uv]
package = false
# Two-week rule: onnxruntime 1.31.x is newer than 2026-10-16.
# jiter 0.18.0 (anthropic's parser) is newer than 2026-10-22.
constraint-dependencies = ["onnxruntime==1.30.0", "jiter==0.17.0"]

# CPU-only PyTorch (D-24): PyPI's Linux wheels pull ~2.5 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }


[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
strict = true
exclude = ["src/vendor"]

# Worker-image-only media libraries (D-24); the API/test image type-checks without them.
[[tool.mypy.overrides]]
module = ["kokoro_onnx", "numpy", "soundfile", "whisperx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "media: needs the worker image (real TTS + alignment models)",
  "live: calls the free-tier LLM and search APIs (D-27); needs ZIRO_LIVE=1 and keys",
]
addopts = "-m 'not media and not live'"

[tool.alembic]
script_location = "src/app/core/migrations"
